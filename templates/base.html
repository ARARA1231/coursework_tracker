{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Учёт курсовых работ{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container d-flex flex-wrap align-items-center gap-3 py-3">
            <a class="brand" href="{% url 'homepage:index' %}">
                <img
                    src="{% static 'homepage/img/logo.png' %}"
                    alt="Учёт курсовых работ"
                    class="brand-logo"
                >
                <span class="brand-title">Учёт курсовых работ</span>
            </a>
            {% include "includes/navigation.html" %}
        </div>
    </header>

    <main class="container py-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container py-3">
            © <span id="current-year"></span> Учёт курсовых работ
        </div>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
