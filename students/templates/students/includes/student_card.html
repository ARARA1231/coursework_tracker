<article class="card person-card mb-3">
    <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div>
            <h3 class="h6 mb-1">{{ student.name|default:"Без имени" }}</h3>
            <p class="text-muted small mb-0">Группа {{ student.group }}</p>
        </div>
        <a class="btn btn-sm btn-outline-primary"
           href="{% url 'students:detail' student.id %}">Подробнее</a>
    </div>
</article>
