<article class="card person-card mb-3">
    <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div>
            <h3 class="h6 mb-1">{{ teacher.name|default:"Без имени" }}</h3>
            <p class="text-muted small mb-1">{{ teacher.department }}</p>
            {% if free_slots > 0 %}
                <span class="slots slots-free">
                    Свободно мест: {{ free_slots }} из {{ teacher.max_students }}
                </span>
            {% else %}
                <span class="slots slots-full">Мест нет</span>
            {% endif %}
        </div>
        <a class="btn btn-sm btn-outline-primary"
           href="{% url 'teachers:detail' teacher.id %}">Подробнее</a>
    </div>
</article>
